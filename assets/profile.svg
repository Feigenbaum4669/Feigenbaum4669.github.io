<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="GigaChad placeholder">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="55%" stop-color="#333"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <linearGradient id="silh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Wide, classical shoulders -->
  <path d="M 30,600
           C 30,470 130,430 220,415
           L 380,415
           C 470,430 570,470 570,600 Z"
        fill="url(#silh)"/>

  <!-- Neck (trapezoid, broad) -->
  <path d="M 240,425
           L 260,345
           L 340,345
           L 360,425 Z"
        fill="url(#silh)"/>

  <!-- Squared head with strong jaw -->
  <path d="M 215,340
           C 215,295 220,255 235,225
           C 250,200 275,185 300,182
           C 325,185 350,200 365,225
           C 380,255 385,295 385,340
           L 375,355
           C 370,365 360,372 350,372
           L 250,372
           C 240,372 230,365 225,355 Z"
        fill="url(#silh)"/>

  <!-- Hair: wavy top -->
  <path d="M 220,235
           C 230,205 250,188 275,180
           C 285,175 295,178 300,180
           C 305,178 315,175 325,180
           C 350,188 370,205 380,235
           C 372,225 365,220 358,222
           C 355,212 348,208 340,212
           C 335,205 325,205 320,210
           C 315,205 305,205 300,208
           C 295,205 285,205 280,210
           C 275,205 265,205 260,212
           C 252,208 245,212 242,222
           C 235,220 228,225 220,235 Z"
        fill="url(#silh)"/>

  <!-- Beard hint (subtle, on chin) -->
  <path d="M 260,348
           C 270,365 285,375 300,376
           C 315,375 330,365 340,348
           L 340,355
           C 335,365 320,372 300,372
           C 280,372 265,365 260,355 Z"
        fill="#070707" opacity="0.7"/>

  <!-- Label -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="300" y="535" font-size="36" font-weight="800" letter-spacing="8" fill="#eaeaea">GIGACHAD</text>
    <text x="300" y="565" font-size="12" font-weight="500" letter-spacing="3" fill="#aaa">PLACEHOLDER · REPLACE ME</text>
  </g>
</svg>
